# NERO QUANTUM – lokaler KI-Stack
# Hardware-Profil: RTX 4080 Super (16 GB VRAM) · 32 GB DDR5
#
# Dienste:
#   - ollama      : führt das Modell auf der GPU aus, stellt eine API bereit
#   - nero-quantum: Chat-Oberfläche im Browser (Claude-artig), self-hosted
#   - searxng     : neutrale Meta-Websuche (für Deep Search & Scraping des Agenten)
#
# Bequemer Start:  ./install.sh   (Linux/macOS)   bzw.   install.ps1 (Windows)
# Manuell:         docker compose up -d
# Öffnen:  http://localhost:3000   (NERO QUANTUM)  ·  http://localhost:8888 (Suche)
# Stoppen: docker compose down

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"            # Ollama-API (lokal)
    volumes:
      - ollama:/root/.ollama     # Modelle bleiben nach Neustart erhalten
    environment:
      - OLLAMA_KEEP_ALIVE=30m    # Modell 30 min im VRAM halten -> schnelle Folgeantworten
      - OLLAMA_FLASH_ATTENTION=1 # schneller + weniger VRAM auf RTX-40-Karten
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all         # GPU an den Container durchreichen
              capabilities: [gpu]

  nero-quantum:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nero-quantum
    restart: unless-stopped
    ports:
      - "3000:8080"              # Browser-Oberflaeche: http://localhost:3000
    volumes:
      - nero-quantum:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true          # eigenes Login (bleibt lokal auf deiner Maschine)
      - WEBUI_NAME=NERO QUANTUM   # Name/Branding der Oberfläche
    depends_on:
      - ollama

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"              # Websuche-API: http://localhost:8888
    volumes:
      - ./searxng:/etc/searxng   # eigene Konfiguration (JSON-Ausgabe aktiviert)
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/

volumes:
  ollama:
  nero-quantum:
